name: RSpec

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      RAILS_ENV: test
      SECRET_KEY_BASE: ci_test_secret_key_base

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Prepare database
        run: bin/rails db:prepare

      - name: Run specs
        run: bundle exec rspec
